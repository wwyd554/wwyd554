<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">武禹德 · AI 产品经理</title>
<desc id="desc">把业务需求，做成可用的 AI 产品。需求、编排、验证、交付四个节点依次点亮。</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d9e3df" stroke-width="1" opacity=".5"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
  text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif}
  .mono{font-family:Menlo,Consolas,monospace;letter-spacing:2px}
  .flow{stroke-dasharray:8 13;animation:flow 2s linear infinite}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-out infinite}
  .p2{animation-delay:1s}.p3{animation-delay:2s}.p4{animation-delay:3s}
  .live{animation:live 2s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-42}}
  @keyframes pulse{0%{opacity:.7;transform:scale(.7)}40%,100%{opacity:0;transform:scale(1.9)}}
  @keyframes live{50%{opacity:.3}}
  @media(prefers-reduced-motion:reduce){.flow,.pulse,.live{animation:none}.pulse{opacity:.15}}
</style>
<rect x="2" y="2" width="1596" height="636" rx="30" fill="#f5f5ef" stroke="#cdd6cf" stroke-width="3"/>
<rect x="880" y="44" width="672" height="550" rx="22" fill="#eaf0e9"/>
<rect x="880" y="44" width="672" height="550" rx="22" fill="url(#grid)"/>
<circle cx="66" cy="66" r="6" fill="#286953"/><text x="87" y="73" class="mono" font-size="18" fill="#52675c">WUYUDE / AI PRODUCT MANAGER</text>
<text x="60" y="169" font-size="19" letter-spacing="4" fill="#728176">ToB AI · AGENT · AI CODING</text>
<text x="56" y="265" font-size="67" font-weight="650" fill="#223e32">把业务需求，</text>
<text x="56" y="351" font-size="67" font-weight="650" fill="#223e32">做成可用的 AI 产品。</text>
<text x="60" y="410" font-size="24" fill="#617266">场景拆解 · 工作流设计 · 效果评测 · 客户交付</text>
<rect x="60" y="455" width="190" height="42" rx="21" fill="#e5ece2"/>
<text x="155" y="483" text-anchor="middle" font-size="18" fill="#42614f">2 年 ToB AI 经验</text>
<rect x="264" y="455" width="218" height="42" rx="21" fill="#e5ece2"/>
<text x="373" y="483" text-anchor="middle" font-size="18" fill="#42614f">20+ 场景化智能体</text>
<text x="60" y="566" font-size="20" fill="#52675c">独立作品 / 销练多多 · 暖爪</text>
<text x="1488" y="91" text-anchor="end" class="mono" font-size="16" fill="#617266">FROM NEED TO PRODUCT</text>
<circle cx="922" cy="84" r="5" fill="#368765" class="live"/>
<path d="M961 391 C1010 391 1015 303 1119 303 S1190 395 1297 395 S1395 285 1470 225" fill="none" stroke="#c1d2c2" stroke-width="3"/>
<path class="flow" d="M961 391 C1010 391 1015 303 1119 303 S1190 395 1297 395 S1395 285 1470 225" fill="none" stroke="#3c8164" stroke-width="3"/>
<g fill="#3c8164"><circle class="pulse" cx="961" cy="391" r="18"/><circle class="pulse p2" cx="1119" cy="303" r="18"/><circle class="pulse p3" cx="1297" cy="395" r="18"/><circle class="pulse p4" cx="1470" cy="225" r="18"/></g>
<g fill="#f5f5ef" stroke="#3c8164" stroke-width="3"><circle cx="961" cy="391" r="9"/><circle cx="1119" cy="303" r="9"/><circle cx="1297" cy="395" r="9"/><circle cx="1470" cy="225" r="9"/></g>
<g font-size="22" font-weight="500" fill="#34523f"><text x="933" y="439">需求</text><text x="1091" y="265">编排</text><text x="1269" y="443">验证</text><text x="1442" y="187">交付</text></g>
<g class="mono" font-size="14" fill="#758779"><text x="933" y="465">DEFINE</text><text x="1091" y="229">BUILD</text><text x="1269" y="469">EVALUATE</text><text x="1415" y="152">DELIVER</text></g>
<path d="M924 524H1510" stroke="#cbd8c9"/>
<text x="926" y="559" font-size="18" fill="#657b69">从产品方案，到真实使用。</text>
<text x="1505" y="559" text-anchor="end" class="mono" font-size="14" fill="#657b69">01 — 04</text>
</svg>
